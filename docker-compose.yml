services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
  app:
    build: .
    env_file: .env
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "7860:7860"
volumes:
  qdrant_data:
